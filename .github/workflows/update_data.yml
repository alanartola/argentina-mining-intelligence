name: Daily mining intelligence update

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 ART (UTC-3, no DST in Argentina)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update (structured data + news monitor)
        run: python -m mining_intel.pipeline.run_daily

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/mining.db; then
            git add data/mining.db
            git commit -m "chore: actualizar datos mineros $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "Sin cambios en data/mining.db"
          fi
